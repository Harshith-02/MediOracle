version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: medioracle_postgres
    restart: always
    environment:
      POSTGRES_USER: medioracle
      POSTGRES_PASSWORD: medioracle_secure_pass
      POSTGRES_DB: medioracle_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medioracle -d medioracle_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medioracle_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medioracle_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://medioracle:medioracle_secure_pass@postgres:5432/medioracle_db
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=medioracle_super_secret_jwt_key_32_chars_long_min_spec!
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: medioracle_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  postgres_data:
